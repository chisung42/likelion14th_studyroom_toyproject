<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>스터디 플랫폼</title>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
  --accent:#58a6ff; --accent2:#3d8bcd; --success:#3fb950; --danger:#f85149;
  --warn:#d29922; --purple:#bc8cff; --text:#e6edf3; --muted:#8b949e;
  --r:10px; --r-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── 헤더 ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:17px;color:var(--accent);white-space:nowrap}
nav{display:flex;gap:2px;flex:1}
.nav-btn{background:none;border:none;color:var(--muted);padding:6px 14px;border-radius:var(--r-sm);cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;white-space:nowrap}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--surface2);color:var(--accent)}
.header-user{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
#userChip{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--muted)}
#userChip span{color:var(--success);font-weight:600}
#logoutBtn{display:none;background:none;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px}
#logoutBtn:hover{border-color:var(--danger);color:var(--danger)}

/* ── 레이아웃 ── */
main{max-width:1000px;margin:0 auto;padding:28px 20px}
.page{display:none}.page.on{display:block}

/* ── 카드 ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:14px}
.card-title{font-size:16px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}

/* ── 폼 ── */
.fg{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
input,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 18px;border-radius:var(--r-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#000}.btn-success:hover{opacity:.85}
.btn-purple{background:var(--purple);color:#000}.btn-purple:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-full{width:100%;justify-content:center}

/* ── 그리드 ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}

/* ── 탭 ── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;gap:0}
.tab{padding:9px 18px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}.tab-pane.active{display:block}

/* ── 아이템 ── */
.item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.item:hover{border-color:var(--accent)}
.item-title{font-weight:600;font-size:15px;margin-bottom:5px}
.item-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-blue{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-green{background:rgba(63,185,80,.15);color:var(--success)}
.badge-red{background:rgba(248,81,73,.15);color:var(--danger)}
.badge-purple{background:rgba(188,140,255,.15);color:var(--purple)}
.badge-warn{background:rgba(210,153,34,.15);color:var(--warn)}

/* ── 모달 ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-ttl{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px}
.modal-close:hover{color:var(--text)}
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── 댓글 ── */
.comment{background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:8px}
.comment-body{font-size:14px;margin-bottom:4px}
.comment-meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* ── 토스트 ── */
#toasts{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 16px;font-size:14px;max-width:300px;animation:fadeUp .2s ease}
.toast.ok{border-left:3px solid var(--success)}
.toast.err{border-left:3px solid var(--danger)}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:30px;color:var(--muted)}

/* ── 예약 ── */
.rsv-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}

/* ── 그룹 신청 ── */
.app-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ── 이미지 미리보기 ── */
.img-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.img-thumb{position:relative;width:80px;height:80px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border:none;color:#fff;border-radius:4px;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<!-- ── 헤더 ── -->
<header>
  <div class="logo">📚 스터디 플랫폼</div>
  <nav>
    <button class="nav-btn active" data-page="home">홈</button>

<main>

<!-- ════════════════ 홈 (인증) ════════════════ -->
<div class="page on" id="page-home">

    <!-- 회원가입 -->

<!-- ════════════════ 게시판 ════════════════ -->
<div class="page" id="page-posts">
  <div class="tabs">
    <button class="tab active" onclick="swTab('posts','list',this)">📋 목록</button>

  <div class="tab-pane active" id="posts-list">
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" onclick="loadPosts()">🔄 새로고침</button>
    </div>
    <div id="postsList"></div>
  </div>

  <div class="tab-pane" id="posts-write">
    <div class="card">
      <div class="card-title">✏️ 게시글 작성</div>
      <div class="fg"><label>제목</label><input id="pt-title" placeholder="제목을 입력하세요"/></div>
      <div class="fg"><label>내용</label><textarea id="pt-content" placeholder="내용을 입력하세요..."></textarea></div>

<!-- ════════════════ 스터디룸 ════════════════ -->

  </div>

  <div class="tab-pane" id="rooms-reserve">

<!-- ════════════════ 모집 ════════════════ -->

  </div>

  </div>

      <div class="card-title">📝 모집글 작성</div>

<!-- ════════════════ 마이페이지 ════════════════ -->
<div class="page" id="page-mypage">
  <div class="tabs">
    <button class="tab active" onclick="swTab('my','info',this)">👤 내 정보</button>
    <button class="tab" onclick="swTab('my','reservations',this);loadMyRsv()">📅 내 예약</button>
  </div>

    </div>
  </div>

  <div class="tab-pane" id="my-reservations">

</main>

<!-- ════ 게시글 상세 모달 ════ -->
<div class="modal-bg" id="postModal">

      <div class="fg"><label>내용</label><textarea id="pmEditContent"></textarea></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="submitEditPost()">저장</button>
        <button class="btn btn-ghost btn-sm" onclick="closeEditPost()">취소</button>
      </div>
    </div>
    <div class="divider"></div>
    <div style="font-size:14px;font-weight:600;margin-bottom:10px">💬 댓글</div>
    <div id="commentsList" style="margin-bottom:12px"></div>
    <div style="display:flex;gap:8px">
      <input id="cmInput" placeholder="댓글을 입력하세요..." style="flex:1"/>

    </div>
  </div>
</div>

<!-- ════ 룸 예약 현황 모달 ════ -->
<div class="modal-bg" id="roomModal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-ttl" id="rmModalTitle"></div>
      <button class="modal-close" onclick="closeModal('roomModal')">✕</button>
    </div>
    <div id="rmModalBody"></div>
  </div>
</div>

<!-- ════ 그룹 상세 모달 ════ -->
<div class="modal-bg" id="groupModal">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-ttl" id="gpTitle"></div>
      <button class="modal-close" onclick="closeModal('groupModal')">✕</button>
    </div>
    <div id="gpMeta" style="font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap"></div>
    <div id="gpDesc" style="font-size:14px;line-height:1.6;margin-bottom:14px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px" id="gpActions">
      <button class="btn btn-purple btn-sm" id="gpApplyBtn" onclick="applyGroup()">✋ 신청하기</button>
      <button class="btn btn-ghost btn-sm" id="gpAppsBtn" style="display:none" onclick="loadApplications()">📋 신청 목록 보기</button>
      <button class="btn btn-danger btn-sm" id="gpDelBtn" style="display:none" onclick="deleteGroup()">🗑 삭제</button>
    </div>
    <div id="gpApplications" style="display:none">
      <div class="divider"></div>
      <div style="font-size:14px;font-weight:600;margin-bottom:10px">📋 신청 목록</div>
      <div id="gpAppsList"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
const BASE = 'http://localhost:8000/api/v1';
let S = { token: null, userId: null, nickname: null, role: null, currentPostId: null, currentGroupId: null };

// ── 세션 복원
(function(){
  const s = localStorage.getItem('sp_session');
  if(s){ Object.assign(S, JSON.parse(s)); refreshHeader(); }
})();

// ── API 헬퍼
async function api(method, path, body, isFile=false){
  const h = {'Content-Type':'application/json'};
  if(S.token) h['Authorization']='Bearer '+S.token;
  const opts = {method, headers:h};
  if(body && !isFile) opts.body = JSON.stringify(body);
  if(isFile){ delete opts.headers['Content-Type']; opts.body = body; }
  const r = await fetch(BASE+path, opts);
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail || 'HTTP '+r.status);
  return d;
}

// ── 토스트
function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ── 헤더 갱신
function refreshHeader(){
  const chip = document.getElementById('userChip');
  const lbtn = document.getElementById('logoutBtn');
  if(S.token){
    chip.style.display='block';
    document.getElementById('userNick').textContent = S.nickname;
    lbtn.style.display='block';
    document.getElementById('sessionBox').style.display='block';
    document.getElementById('sessionDetail').innerHTML =
      `<b>닉네임:</b> ${S.nickname}  <b>role:</b> ${S.role}  <b>ID:</b> ${S.userId}`;
    if(S.role==='admin') document.getElementById('tabAdminRoom').style.display='block';
  } else {
    chip.style.display='none';
    lbtn.style.display='none';
    document.getElementById('sessionBox').style.display='none';
    document.getElementById('tabAdminRoom').style.display='none';
  }
}

// ── 로그아웃
function logout(){
  Object.assign(S, {token:null, userId:null, nickname:null, role:null});
  localStorage.removeItem('sp_session');
  refreshHeader();
  toast('로그아웃 되었습니다');
}

// ── 페이지 전환
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('page-'+name).classList.add('on');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-page="${name}"]`).classList.add('active');
  if(name==='posts') loadPosts();
  if(name==='rooms') { loadRooms(); loadRoomsForSelect(); }
  if(name==='groups') loadGroups();
  if(name==='mypage') loadMe();
}

document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click', ()=>showPage(b.dataset.page));
});

// ── 탭 전환
function swTab(page, pane, btn){
  const pageId = page === 'my' ? 'page-mypage' : `page-${page}`;
  const pageEl = document.getElementById(pageId);
  if (!pageEl) return;
  pageEl.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btn.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const paneId = page === 'my' ? `my-${pane}` : `${page}-${pane}`;
  const paneEl = document.getElementById(paneId);
  if (paneEl) paneEl.classList.add('active');
  btn.classList.add('active');
  if (page === 'rooms' && pane === 'reserve') loadRoomsForSelect();
}

// ── 모달
function openModal(id){document.getElementById(id).classList.add('on')}
function closeModal(id){document.getElementById(id).classList.remove('on')}
document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.classList.remove('on'); });
});

// ── 유틸
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDt = iso=>new Date(iso).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtD  = iso=>new Date(iso).toLocaleDateString('ko-KR',{month:'short',day:'numeric'});
const loading = ()=>'<div class="loading"><div class="spin"></div></div>';
const empty  = msg=>`<div class="empty">${msg}</div>`;

    await api('PATCH',`/groups/applications/${appId}`,{status});
    toast(status==='accepted'?'수락되었습니다':'거절되었습니다');
    await loadApplications();
    await openGroup(S.currentGroupId);
  }catch(ex){ toast(ex.message,'err'); }
}

async function deleteGroup(){
  if(!confirm('모집글을 삭제하시겠습니까?')) return;
  try{
    await api('DELETE',`/groups/${S.currentGroupId}`);
    closeModal('groupModal'); toast('삭제되었습니다'); loadGroups();
  }catch(ex){ toast(ex.message,'err'); }
}
</script>
